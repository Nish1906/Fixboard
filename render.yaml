services:
  - type: web
    name: fixboard
    runtime: docker
    plan: starter          # a persistent disk needs a paid plan
    healthCheckPath: /healthz
    disk:
      name: fixboard-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FOUNDER_EMAIL
        sync: false
      - key: FOUNDER_NAME
        value: Nishant Parekh
      - key: SUPPORT_EMAIL
        sync: false
      - key: MAIL_PROVIDER
        value: resend
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
